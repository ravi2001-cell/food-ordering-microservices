version: "3.8"

services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: fooddb
      MYSQL_USER: fooduser
      MYSQL_PASSWORD: foodpass123
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  user-service:
    image: rkdocker1800/fms:user-v1
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fooddb
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass123
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  restaurant-service:
    image: rkdocker1800/fms:restaurant-v1
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fooddb
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass123
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  order-service:
    image: rkdocker1800/fms:order-v1
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fooddb
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass123
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  payment-service:
    image: rkdocker1800/fms:payment-v1
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fooddb
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass123
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  notification-service:
    image: rkdocker1800/fms:notification-v1
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: fooddb
      DB_USERNAME: fooduser
      DB_PASSWORD: foodpass123
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx512m"
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  nginx:
    image: nginx:alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx_config
        target: /etc/nginx/nginx.conf
    networks:
      - food-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  food-network:
    driver: overlay

volumes:
  mysql-data:

configs:
  nginx_config:
    file: ./nginx/nginx.conf
